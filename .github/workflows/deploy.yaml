name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      - name: Build Worker
        run: pnpm run build:app

      - name: Deploy Worker
        working-directory: packages/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Smoke test Worker
         env:
             TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
         run: |
           curl -fsv --connect-timeout 20 \
            --get \
            --data-urlencode "target=sing-box" \
            --data-urlencode "url=${TEST_SUB_URL}" \
            "https://sub-workers.ymnh7087.workers.dev/sub" \
            -o /tmp/sub-result.json

          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/sub-result.json','utf8')); if (!Array.isArray(d.outbounds) || d.outbounds.length === 0) { throw new Error('Conversion returned zero outbounds'); } console.log('Conversion OK: ' + d.outbounds.length + ' outbounds');"