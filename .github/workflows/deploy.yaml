name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      - name: Build Worker
        run: pnpm run build:app

      - name: Deploy Worker
        working-directory: packages/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Diagnose subscription format
        env:
          TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
        run: |
          curl -sS \
            --connect-timeout 20 \
            --max-time 30 \
            -D /tmp/sub-headers.txt \
            -o /tmp/raw-subscription \
            "${TEST_SUB_URL}"

          echo "=== Subscription response ==="
          grep -Ei '^(HTTP/|content-type:|content-length:|content-encoding:)' /tmp/sub-headers.txt || true

          echo "Body bytes:"
          wc -c < /tmp/raw-subscription

          node <<'NODE'
          const fs = require('fs');

          const raw = fs.readFileSync('/tmp/raw-subscription');
          const text = raw.toString('utf8').trim();

          console.log('=== Format detection ===');

          if (!text) {
            console.log('Detected: EMPTY');
            process.exit(0);
          }

          const keys = [
            'dm1lc3M',
            'c3NyOi8v',
            'c29ja3M6Ly',
            'dHJvamFu',
            'c3M6Ly',
            'c3NkOi8v',
            'c2hhZG93',
            'aHR0c',
            'dmxlc3M=',
            'aHlzdGVyaWEy',
            'aHkyOi8v',
            'd2lyZWd1YXJkOi8v',
            'd2c6Ly8=',
            'dHVpYzovLw=='
          ];

          function isBase64Valid(value) {
            if (!value || value.length % 4 !== 0) {
              return false;
            }

            if (!/^[A-Za-z0-9+/]*={0,2}$/.test(value)) {
              return false;
            }

            try {
              const decoded = Buffer.from(value, 'base64');
              return decoded.length > 0;
            } catch {
              return false;
            }
          }

          const isValid = isBase64Valid(text);

          const matchedKeys = keys.filter(
            key => text.includes(key)
          );

          const looksLikeURI =
            /^\w+:\/\/\w+/im.test(text);

          console.log('Length:', text.length);
          console.log('Length % 4:', text.length % 4);
          console.log('Base64 validation:', isValid);
          console.log(
            'Matched protocol keys:',
            matchedKeys.length
              ? matchedKeys.join(', ')
              : '(none)'
          );
          console.log(
            'Looks like raw URI already:',
            looksLikeURI
          );

          const base64PreprocessorTest =
            isValid &&
            !looksLikeURI &&
            matchedKeys.length > 0;

          console.log(
            'Base64Encoded() test result:',
            base64PreprocessorTest
          );

          console.log(
            'Fallback Base64 test result:',
            isValid
          );

          console.log(
            'First character:',
            JSON.stringify(text[0])
          );

          console.log(
            'Line count:',
            text.split(/\r?\n/).length
          );

          try {
            const decodedText =
              Buffer.from(text, 'base64')
                .toString('utf8')
                .trim();

            console.log('=== Base64 decode ===');

            console.log(
              'Decoded bytes:',
              Buffer.byteLength(decodedText)
            );

            console.log(
              'Decoded first character:',
              JSON.stringify(decodedText[0] || '')
            );

            console.log(
              'Decoded line count:',
              decodedText.split(/\r?\n/).length
            );

            const protocols = {};

            for (
              const line of decodedText
                .split(/\r?\n/)
                .map(x => x.trim())
                .filter(Boolean)
            ) {
              const match =
                line.match(
                  /^([a-zA-Z0-9+.-]+):\/\//
                );

              if (match) {
                const protocol =
                  match[1].toLowerCase();

                protocols[protocol] =
                  (protocols[protocol] || 0) + 1;
              }
            }

            console.log(
              'Decoded protocols:',
              JSON.stringify(protocols)
            );

            if (
              /^(ss|ssr|vmess|vless|trojan|hysteria|hysteria2):\/\//m
                .test(decodedText)
            ) {
              console.log(
                'Decoded format: proxy URI list'
              );
            } else {
              console.log(
                'Decoded format: UNKNOWN'
              );
            }

          } catch (error) {
            console.log(
              'Base64 decode: FAILED'
            );
          }
          NODE

      - name: Diagnose SS parser
        run: |
          node --input-type=module <<'NODE'
          import fs from 'fs'
          import { parsers, parseProxyLines } from './packages/core/build/index.js'

          const raw = fs.readFileSync('/tmp/raw-subscription', 'utf8').trim()

          let decoded = raw
          try {
            decoded = Buffer.from(raw, 'base64').toString('utf8').trim()
          } catch {}

          const lines = decoded
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean)

          const ssLines = lines.filter(x => /^ss:\/\//.test(x))

          const ss = parsers.find(p => p.name === 'URI SS Parser')

          if (!ss) {
            console.log('URI SS Parser: NOT FOUND')
            process.exit(1)
          }

          let matched = 0
          let parsed = 0
          let complete = 0
          let failed = 0

          for (const line of ssLines) {
            if (!ss.test(line)) continue

            matched++

            try {
              const proxy = ss.parse(line)

              if (proxy) {
                parsed++

                if (
                  proxy.server &&
                  proxy.port &&
                  proxy.cipher &&
                  proxy.password
                ) {
                  complete++
                }
              }
            } catch {
              failed++
            }
          }

          const allParsed = parseProxyLines(lines, {})

          const typeCounts = {}

          for (const proxy of allParsed) {
            typeCounts[proxy.type] =
              (typeCounts[proxy.type] || 0) + 1
          }

          console.log('=== SS parser diagnostic ===')
          console.log('Total decoded lines:', lines.length)
          console.log('SS lines:', ssLines.length)
          console.log('SS parser matched:', matched)
          console.log('SS parser parsed:', parsed)
          console.log('SS parsed complete:', complete)
          console.log('SS parse failed:', failed)
          console.log('All parsed proxies:', allParsed.length)
          console.log('Proxy types:', JSON.stringify(typeCounts))
          NODE
