name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      - name: Build Worker
        run: pnpm run build:app

      - name: Deploy Worker
        working-directory: packages/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Diagnose subscription source
        env:
          TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
        run: |
          curl -sS \
            --connect-timeout 20 \
            --max-time 30 \
            -D /tmp/sub-headers.txt \
            -o /tmp/raw-subscription \
            "${TEST_SUB_URL}"

          echo "=== Subscription response ==="
          grep -Ei '^(HTTP/|content-type:|content-length:|content-encoding:)' /tmp/sub-headers.txt || true

          echo "Body bytes:"
          wc -c < /tmp/raw-subscription

          echo "First 80 bytes (sanitized):"
          head -c 80 /tmp/raw-subscription | tr '\r\n' ' ' | cut -c 1-80
          echo
