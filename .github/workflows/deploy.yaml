name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      - name: Build Worker
        run: pnpm run build:app

      - name: Deploy Worker
        working-directory: packages/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Diagnose subscription format
        env:
          TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
        run: |
          curl -sS \
            --connect-timeout 20 \
            --max-time 30 \
            -D /tmp/sub-headers.txt \
            -o /tmp/raw-subscription \
            "${TEST_SUB_URL}"

          echo "=== Subscription response ==="
          grep -Ei '^(HTTP/|content-type:|content-length:|content-encoding:)' /tmp/sub-headers.txt || true

          echo "Body bytes:"
          wc -c < /tmp/raw-subscription

          node <<'NODE'
          const fs = require('fs');
          const { Base64 } = require('js-base64');

          const raw = fs.readFileSync('/tmp/raw-subscription');
          const text = raw.toString('utf8').trim();

          console.log('=== Format detection ===');

          if (!text) {
            console.log('Detected: EMPTY');
            process.exit(0);
          }

          const keys = [
            'dm1lc3M',
            'c3NyOi8v',
            'c29ja3M6Ly',
            'dHJvamFu',
            'c3M6Ly',
            'c3NkOi8v',
            'c2hhZG93',
            'aHR0c',
            'dmxlc3M=',
            'aHlzdGVyaWEy',
            'aHkyOi8v',
            'd2lyZWd1YXJkOi8v',
            'd2c6Ly8=',
            'dHVpYzovLw==',
          ];

          const isBase64Valid = Base64.isValid(text);

          console.log('Length:', text.length);
          console.log('Length % 4:', text.length % 4);
          console.log('js-base64 Base64.isValid:', isBase64Valid);

          const matchedKeys = keys.filter(k => text.includes(k));

          console.log(
            'Matched Base64 protocol keys:',
            matchedKeys.length ? matchedKeys.join(', ') : '(none)'
          );

          const looksLikeURI = /^\w+:\/\/\w+/im.test(text);

          console.log(
            'Looks like raw URI already:',
            looksLikeURI
          );

          const base64PreprocessorTest =
            isBase64Valid &&
            !looksLikeURI &&
            matchedKeys.length > 0;

          console.log(
            'Base64Encoded() test result:',
            base64PreprocessorTest
          );

          const fallbackTest = isBase64Valid;

          console.log(
            'Fallback Base64 test result:',
            fallbackTest
          );

          console.log(
            'First character:',
            JSON.stringify(text[0])
          );

          console.log(
            'Line count:',
            text.split(/\r?\n/).length
          );

          let decodedText = '';

          try {
            const decoded = Base64.decode(text);
            decodedText = decoded.trim();

            console.log('=== Base64 decode ===');
            console.log('Decoded bytes:', Buffer.byteLength(decoded));
            console.log(
              'Decoded first character:',
              JSON.stringify(decodedText[0] || '')
            );
            console.log(
              'Decoded line count:',
              decodedText.split(/\r?\n/).length
            );

            const protocols = {};

            for (
              const line of decodedText
                .split(/\r?\n/)
                .map(x => x.trim())
                .filter(Boolean)
            ) {
              const match = line.match(/^([a-zA-Z0-9+.-]+):\/\//);

              if (match) {
                const protocol = match[1].toLowerCase();
                protocols[protocol] =
                  (protocols[protocol] || 0) + 1;
              }
            }

            console.log(
              'Decoded protocols:',
              JSON.stringify(protocols)
            );

            if (decodedText.startsWith('{')) {
              console.log('Decoded format: JSON-like');
            } else if (
              decodedText.startsWith('proxies:') ||
              decodedText.includes('\nproxies:')
            ) {
              console.log('Decoded format: Clash YAML-like');
            } else if (
              /^(ss|ssr|vmess|vless|trojan|hysteria|hysteria2):\/\//m.test(decodedText)
            ) {
              console.log('Decoded format: proxy URI list');
            } else if (
              decodedText.startsWith('http://') ||
              decodedText.startsWith('https://')
            ) {
              console.log('Decoded format: URL-like');
            } else {
              console.log('Decoded format: UNKNOWN');
            }

          } catch (error) {
            console.log('Base64 decode: FAILED');
            console.log('Decode error:', error.message);
          }
          NODE
