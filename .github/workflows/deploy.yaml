name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      - name: Build Worker
        run: pnpm run build:app

      - name: Deploy Worker
        working-directory: packages/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Diagnose subscription format
        env:
          TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
        run: |
          curl -sS \
            --connect-timeout 20 \
            --max-time 30 \
            -D /tmp/sub-headers.txt \
            -o /tmp/raw-subscription \
            "${TEST_SUB_URL}"

          echo "=== Subscription response ==="
          grep -Ei '^(HTTP/|content-type:|content-length:|content-encoding:)' /tmp/sub-headers.txt || true

          echo "Body bytes:"
          wc -c < /tmp/raw-subscription

          node <<'NODE'
          const fs = require('fs');

          const raw = fs.readFileSync('/tmp/raw-subscription');
          const text = raw.toString('utf8').trim();

          console.log('=== Format detection ===');

          if (!text) {
            console.log('Detected: EMPTY');
            process.exit(0);
          }

          let detected = [];

          try {
            const json = JSON.parse(text);
            detected.push('JSON');

            if (Array.isArray(json)) {
              detected.push('JSON array');
            } else if (json && typeof json === 'object') {
              detected.push('JSON object');
            }
          } catch {}

          if (/^[-\w]+:\s/m.test(text)) {
            detected.push('YAML-like');
          }

          if (/^(ss|ssr|vmess|vless|trojan|hysteria|hysteria2):\/\//m.test(text)) {
            detected.push('proxy URI list');
          }

          if (/^proxies:\s*$/m.test(text)) {
            detected.push('Clash YAML');
          }

          if (/^mixed-port:\s*/m.test(text) || /^port:\s*/m.test(text)) {
            detected.push('Clash-style config');
          }

          if (/^[A-Za-z0-9+/=\r\n]+$/.test(text)) {
            detected.push('Base64-like');
          }

          if (/^<!DOCTYPE html/i.test(text) || /^<html/i.test(text)) {
            detected.push('HTML');
          }

          if (/^(vmess|vless|trojan|ss|ssr|hysteria2?):\/\//i.test(text)) {
            detected.push('single proxy URI');
          }

          console.log(
            'Detected:',
            detected.length ? detected.join(', ') : 'UNKNOWN TEXT'
          );

          console.log(
            'First character:',
            JSON.stringify(text[0])
          );

          console.log(
            'Line count:',
            text.split(/\r?\n/).length
          );

          try {
            const decoded = Buffer.from(text, 'base64');
            const decodedText = decoded.toString('utf8').trim();

            console.log('=== Base64 decode ===');
            console.log('Decoded bytes:', decoded.length);

            console.log(
              'Decoded first character:',
              JSON.stringify(decodedText[0] || '')
            );

            console.log(
              'Decoded line count:',
              decodedText.split(/\r?\n/).length
            );

            if (decodedText.startsWith('{')) {
              console.log('Decoded format: JSON-like');
            } else if (
              decodedText.startsWith('proxies:') ||
              decodedText.includes('\nproxies:')
            ) {
              console.log('Decoded format: Clash YAML-like');
            } else if (
              /^(ss|ssr|vmess|vless|trojan|hysteria|hysteria2):\/\//m.test(decodedText)
            ) {
              console.log('Decoded format: proxy URI list');
            } else if (
              decodedText.startsWith('http://') ||
              decodedText.startsWith('https://')
            ) {
              console.log('Decoded format: URL-like');
            } else {
              console.log('Decoded format: UNKNOWN');
            }
          } catch {
            console.log('Base64 decode: FAILED');
          }
          NODE
