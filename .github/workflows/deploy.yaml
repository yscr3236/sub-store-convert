name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      - name: Build Worker
        run: pnpm run build:app

      - name: Deploy Worker
        working-directory: packages/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Smoke test Worker
        env:
          TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
        run: |
          HTTP_CODE=$(curl -sS \
            --connect-timeout 20 \
            --get \
            --data-urlencode "target=sing-box" \
            --data-urlencode "url=${TEST_SUB_URL}" \
            -o /tmp/sub-result.json \
            -w "%{http_code}" \
            "https://sub-workers.ymnh7087.workers.dev/sub")

          echo "HTTP status: ${HTTP_CODE}"

          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/sub-result.json', 'utf8');
            console.log('Response bytes:', Buffer.byteLength(raw));

            let d;
            try {
              d = JSON.parse(raw);
            } catch {
              console.error('Response is not valid JSON');
              process.exit(1);
            }

            console.log('Top-level keys:', Object.keys(d).join(', ') || '(none)');

            if (Array.isArray(d.outbounds)) {
              console.log('Outbounds:', d.outbounds.length);
            } else {
              console.log('Outbounds: none');
            }

            if (typeof d.error === 'string') {
              console.log('Error:', d.error);
            }

            if (Array.isArray(d.outbounds) && d.outbounds.length > 0) {
              console.log('Conversion OK');
              process.exit(0);
            }

            console.error('Conversion returned zero outbounds');
            process.exit(1);
          "
